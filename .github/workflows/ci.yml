# Download Manager CI — stable gates across supported macOS lanes.
# This workflow NEVER signs, notarizes, or uses production secrets (they are not
# required for ordinary development).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast gate (Xcode 27)
    # `xcode-27` is GitHub's macOS 27 image (public preview as of 2026-10). It
    # carries Xcode 27.0 27A266a, the same build the maintainers develop on.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        # Pinned to the maintainers' toolchain. The old fallback loop silently
        # built with whatever Xcode it found, which is how CI ended up on Swift
        # 6.1 while development moved to 6.4 and the two disagreed on types.
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version
      - name: Bootstrap tools
        run: make bootstrap-tools
      - name: Doctor
        run: make doctor
      - name: Fast gate
        run: make verify-fast
      - name: Upload fast-gate evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-gate-evidence-${{ github.run_id }}
          path: |
            Artifacts/validation/
          if-no-files-found: ignore

  full-gate:
    name: Full stable gate (Xcode 27)
    runs-on: xcode-27
    needs: fast-gate
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        # Pinned to the maintainers' toolchain. The old fallback loop silently
        # built with whatever Xcode it found, which is how CI ended up on Swift
        # 6.1 while development moved to 6.4 and the two disagreed on types.
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version
      - name: Bootstrap tools
        run: make bootstrap-tools
      - name: Doctor
        run: make doctor
      - name: Full stable gate
        run: make verify
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.run_id }}
          path: Artifacts/validation/
          if-no-files-found: ignore

  # Flow supports macOS 14+, but the gates above run on macOS 27. Some behaviour
  # comes from the OS rather than the code — UTType's MIME database, for one,
  # did not know apk/torrent on macOS 15, so those downloads lost their
  # extension there. This lane runs the unit tests on macOS 15 to surface that.
  # Xcode 27 does not run on this image, so it builds with Xcode 26.3; a failure
  # caused only by that older compiler is not a user-facing bug, hence
  # non-blocking. Read its failures; do not let them go stale.
  macos-15-compat:
    name: Unit tests on macOS 15 (non-blocking)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
      - name: Bootstrap tools
        run: make bootstrap-tools
      - name: Unit tests
        run: make test-unit
