# Download Manager CI — stable gates across supported macOS lanes.
# This workflow NEVER signs, notarizes, or uses production secrets (they are not
# required for ordinary development — 00-master-plan.md §6, bootstrap prompt §7).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast gate (macos-15)
    # Flow requires Swift 6 / Xcode 16+. Public macos-14 images still default to
    # Xcode 15.4, so they cannot build this tree even when format-check is green.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: |
          for app in /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.app /Applications/Xcode.app; do
            if [[ -d "$app" ]]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
      - name: Bootstrap tools
        run: make bootstrap-tools
      - name: Doctor
        run: make doctor
      - name: Fast gate
        run: make verify-fast
      - name: Upload fast-gate evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-gate-evidence-${{ github.run_id }}
          path: |
            Artifacts/validation/
          if-no-files-found: ignore

  full-gate:
    name: Full stable gate (macos-15)
    runs-on: macos-15
    needs: fast-gate
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: |
          for app in /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.app /Applications/Xcode.app; do
            if [[ -d "$app" ]]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
      - name: Bootstrap tools
        run: make bootstrap-tools
      - name: Doctor
        run: make doctor
      - name: Full stable gate
        run: make verify
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.run_id }}
          path: Artifacts/validation/
          if-no-files-found: ignore
