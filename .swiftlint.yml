# SwiftLint configuration — syntax-aware safety rules for first-party code
# (05-quality-testing-release-gates.md §6). Run strict via `make lint`.
#
# only_rules (not the full default set): metric/style defaults like file_length,
# type_body_length, identifier_name, and cyclomatic_complexity are not part of
# this project's gate. Transfer hot-path types are intentionally large; width
# and formatting belong to SwiftFormat.
included:
  - Sources
  - Tests
excluded:
  - .build
  - DerivedData
  - macos-download-manager-prompt-pack
  - Artifacts

only_rules:
  - force_cast
  - force_try
  - force_unwrapping
  - empty_count
  - fatal_error_message
  - overridden_super_call
  - prohibited_super_call
  - unowned_variable_capture
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - toggle_bool
  - yoda_condition

analyzer_rules:
  - unused_import

force_cast: error
force_try: error
force_unwrapping: error
