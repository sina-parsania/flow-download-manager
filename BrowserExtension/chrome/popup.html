<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flow DM</title>
    <style>
      :root {
        --mist: #e6edf2;
        --mist-deep: #d1dde8;
        --ink: #141a1f;
        --ink-soft: #525c66;
        --signal: #c7f22e;
        --signal-deep: #6bad0a;
        --ember: #eb5130;
        --ok: #1f8a4c;
        --surface: rgba(255, 255, 255, 0.88);
        --stroke: rgba(20, 26, 31, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: transparent;
      }

      body {
        margin: 0;
        width: 336px;
        padding: 8px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: var(--ink);
        background: #c5d2dc;
      }

      .shell {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(20, 26, 31, 0.08);
        box-shadow:
          0 10px 28px rgba(20, 26, 31, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.65);
        background:
          radial-gradient(120% 80% at 100% 0%, rgba(199, 242, 46, 0.28), transparent 55%),
          radial-gradient(90% 70% at 0% 100%, rgba(111, 180, 210, 0.22), transparent 50%),
          linear-gradient(165deg, var(--mist), var(--mist-deep));
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand img {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        box-shadow: 0 4px 12px rgba(20, 26, 31, 0.12);
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-copy h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .brand-copy p {
        margin: 1px 0 0;
        color: var(--ink-soft);
        font-size: 11px;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.12s ease, filter 0.12s ease, background 0.12s ease;
      }

      button:active {
        transform: scale(0.98);
      }

      button.primary {
        background: var(--signal);
        color: var(--ink);
        box-shadow: 0 6px 16px rgba(107, 173, 10, 0.22);
      }

      button.primary:hover {
        filter: brightness(1.03);
      }

      button.secondary {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--stroke);
      }

      button.secondary:hover {
        background: #fff;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--stroke);
        border-radius: 12px;
        padding: 10px 12px;
        backdrop-filter: blur(10px);
      }

      .option {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .option + .option {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--stroke);
      }

      .option input {
        margin: 2px 0 0;
        accent-color: var(--signal-deep);
      }

      .option label {
        display: block;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
      }

      .option .hint {
        margin-top: 3px;
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 400;
        line-height: 1.35;
      }

      #status {
        min-height: 18px;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(20, 26, 31, 0.06);
        color: var(--ink-soft);
        font-size: 12px;
      }

      #status.ok {
        background: rgba(31, 138, 76, 0.12);
        color: var(--ok);
      }

      #status.error {
        background: rgba(235, 81, 48, 0.12);
        color: var(--ember);
      }

      #status.busy {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="brand">
        <img src="icons/icon48.png" alt="" width="36" height="36" />
        <div class="brand-copy">
          <h1>Flow DM</h1>
          <p>Send links to Flow on this Mac</p>
        </div>
      </div>

      <div class="actions">
        <button id="send" class="primary" type="button">Send current tab</button>
        <button id="ping" class="secondary" type="button">Check connection</button>
      </div>

      <div class="card">
        <div class="option">
          <input id="takeover" type="checkbox" />
          <div>
            <label for="takeover">Take over browser downloads</label>
            <div class="hint">Off by default. Routes new Chrome downloads into Flow.</div>
          </div>
        </div>
        <div class="option">
          <input id="cookies" type="checkbox" />
          <div>
            <label for="cookies">Include sign-in cookies</label>
            <div class="hint">
              Only for the exact link you send. Chrome will ask for site-data permission.
            </div>
          </div>
        </div>
      </div>

      <div id="status" role="status">Ready</div>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
