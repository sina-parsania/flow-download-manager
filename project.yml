# XcodeGen project definition — the SINGLE SOURCE OF TRUTH for DownloadManager.xcodeproj.
#
# The .xcodeproj is generated (and gitignored); regenerate with `make project`
# (xcodegen). Do not hand-edit. First-party modules live in the local SwiftPM
# package (Package.swift, product set "DownloadKit"); this project hosts only the
# app + agent executables and the test bundles. See Documentation/adr/0001-build-system.md.
name: DownloadManager

options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.44.0"
  groupSortPosition: top

configFiles:
  Debug: Configuration/Shared.xcconfig
  Release: Configuration/Shared.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.4.5"
    CURRENT_PROJECT_VERSION: "15"
  configs:
    Debug:
      SWIFT_COMPILATION_MODE: incremental
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      ONLY_ACTIVE_ARCH: "YES"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: "s"

packages:
  DownloadKit:
    path: .
  # Same exact pin as the local package's dependency, referenced directly so
  # database test targets can `import GRDB` (e.g. to build a deliberately-failing
  # migrator for the interrupted-migration test).
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

targets:

  # --- Per-user LaunchAgent executable (embedded in the app bundle) ---
  DownloadEngineAgent:
    type: tool
    platform: macOS
    sources: [Sources/EngineAgentMain]
    dependencies:
      - package: DownloadKit
        product: EngineAgent
      - package: DownloadKit
        product: Domain
      - package: DownloadKit
        product: Persistence
      - package: DownloadKit
        product: XPCContracts
      - package: DownloadKit
        product: SharedObservability
      - package: DownloadKit
        product: SharedSecurity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DM_AGENT_BUNDLE_ID)

  # --- App-scoped XPC service for ad-hoc / DerivedData (macOS 26+ cannot
  # archive NSXPCListenerEndpoint to disk; LaunchAgent MachServices hit LWCR). ---
  DownloadEngineAgentXPC:
    type: xpc-service
    platform: macOS
    sources: [Sources/EngineAgentMain]
    dependencies:
      - package: DownloadKit
        product: EngineAgent
      - package: DownloadKit
        product: Domain
      - package: DownloadKit
        product: Persistence
      - package: DownloadKit
        product: XPCContracts
      - package: DownloadKit
        product: SharedObservability
      - package: DownloadKit
        product: SharedSecurity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DM_AGENT_BUNDLE_ID)
        # .xpc wrapper / service name seen by NSXPCConnection(serviceName:)
        PRODUCT_NAME: DownloadEngineAgent
        # Avoid colliding with the LaunchAgent tool's swiftmodule outputs.
        PRODUCT_MODULE_NAME: DownloadEngineAgentXPC
        INFOPLIST_KEY_CFBundleDisplayName: DownloadEngineAgent
    info:
      path: Configuration/DownloadEngineAgentXPC-Info.plist
      properties:
        CFBundlePackageType: XPC!
        CFBundleDisplayName: DownloadEngineAgent
        XPCService:
          ServiceType: Application

  # --- Main application (SwiftUI @main) ---
  DownloadManager:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Resources/Localizable.xcstrings
      - path: Resources/Assets.xcassets
      - path: Resources/Updates/appcast.xml
      # LaunchAgent plist embedded at Contents/Library/LaunchAgents/ for SMAppService.
      - path: Resources/LaunchAgents/org.downloadmanager.local.DownloadEngineAgent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    postCompileScripts:
      - name: Sync Chrome Companion Resources
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/BrowserExtension/chrome"
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ChromeCompanion"
          mkdir -p "${DEST}"
          rsync -a --delete \
            --exclude 'README.md' \
            --exclude '.DS_Store' \
            "${SRC}/" "${DEST}/"
          test -f "${DEST}/manifest.json"
          cp "${SRCROOT}/Scripts/chrome-load-unpacked.py" \
            "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/chrome-load-unpacked.py"
    dependencies:
      - package: DownloadKit
        product: Presentation
      - package: Sparkle
        product: Sparkle
      - target: DownloadEngineAgent
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: DownloadEngineAgentXPC
        embed: true
        codeSign: true
      - target: ChromeNativeHost
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DM_APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Configuration/DownloadManager.entitlements
    entitlements:
      path: Configuration/DownloadManager.entitlements
      properties:
        # Ad-hoc + Hardened Runtime otherwise rejects Sparkle.framework (different Team IDs).
        com.apple.security.cs.disable-library-validation: true
    info:
      path: Configuration/DownloadManager-Info.plist
      properties:
        CFBundleDisplayName: Flow Download Manager
        CFBundleName: Flow Download Manager
        # Interpolated from the build settings above, never hardcoded. A literal
        # here silently wins over the MARKETING_VERSION/CURRENT_PROJECT_VERSION
        # that `make release-dmg-unsigned` passes on the command line, so a DMG
        # gets NAMED with the new version while shipping an app that reports the
        # old one — invisible until a user opens About. build-dmg.sh now fails
        # closed on that mismatch, and this is the reason it can no longer happen.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        # Menu-bar agent — no Dock tile (Neat-style). Pair with accessory policy.
        LSUIElement: true
        NSHumanReadableCopyright: "GPL-3.0-or-later"
        NSPrincipalClass: NSApplication
        # Sparkle 2 — EdDSA public key (private key stays in maintainer Keychain).
        SUFeedURL: https://raw.githubusercontent.com/sina-parsania/flow-download-manager/main/docs/appcast.xml
        SUPublicEDKey: /b6wI3YAIL72PL4z6IGRbUjTmCjdxQCzSZ9SXEFCqn8=
        # Manual Check for Updates by default — automatic paths are Settings opt-ins.
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 86400
        # Local-dev URL scheme only (FR-ING dock / URL handoff). Not for production distribution.
        CFBundleURLTypes:
          - CFBundleURLName: org.downloadmanager.local.dev-scheme
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - downloadmanager
        # Finder / Dock drop of link lists onto the app icon (FR-ING).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Plain text link list
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.comma-separated-values-text
              - public.utf8-plain-text
            CFBundleTypeExtensions:
              - txt
              - csv

  # --- Chrome Native Messaging host ---
  ChromeNativeHost:
    type: tool
    platform: macOS
    sources: [Sources/ChromeNativeHostMain]
    dependencies:
      - package: DownloadKit
        product: NativeMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DM_NATIVE_HOST_BUNDLE_ID)
        PRODUCT_NAME: ChromeNativeHost
        CODE_SIGN_ENTITLEMENTS: Configuration/DownloadManager.entitlements
    entitlements:
      path: Configuration/DownloadManager.entitlements

  # --- Tests ---
  UnitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/Unit]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: $(DM_BUNDLE_ID_PREFIX).UnitTests
    dependencies:
      - package: DownloadKit
        product: Domain
      - package: DownloadKit
        product: EngineAgent
      - package: DownloadKit
        product: XPCContracts
      - package: DownloadKit
        product: Persistence
      - package: DownloadKit
        product: SharedObservability
      - package: DownloadKit
        product: SharedSecurity
      - package: DownloadKit
        product: Presentation
      - package: DownloadKit
        product: TransferCurlBridge
      - package: DownloadKit
        product: TransferCore
      - package: DownloadKit
        product: TorrentCore
      - package: DownloadKit
        product: MediaIsolation
      - package: DownloadKit
        product: NativeMessaging
      - package: DownloadKit
        product: Application
      - package: GRDB
        product: GRDB

  IntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/Integration]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: $(DM_BUNDLE_ID_PREFIX).IntegrationTests
    dependencies:
      - package: DownloadKit
        product: TestFaultService
      - package: DownloadKit
        product: TransferCore
      - package: DownloadKit
        product: TransferCurlBridge
      - package: DownloadKit
        product: EngineAgent
      - package: DownloadKit
        product: Persistence
      - package: DownloadKit
        product: SharedSecurity

  RecoveryTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/Recovery]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: $(DM_BUNDLE_ID_PREFIX).RecoveryTests
    dependencies:
      - package: DownloadKit
        product: Persistence
      - package: DownloadKit
        product: TransferCore
      - package: DownloadKit
        product: TestFaultService

  PerformanceTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/Performance]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: $(DM_BUNDLE_ID_PREFIX).PerformanceTests
    dependencies:
      - package: DownloadKit
        product: Presentation
      - package: DownloadKit
        product: TestFaultService
      - package: DownloadKit
        product: TransferCore
      - package: DownloadKit
        product: TransferCurlBridge

  UITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/UI]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: $(DM_BUNDLE_ID_PREFIX).UITests
        TEST_TARGET_NAME: DownloadManager
    dependencies:
      - target: DownloadManager

schemes:
  DownloadManager:
    build:
      targets:
        DownloadManager: all
        DownloadEngineAgent: all
        DownloadEngineAgentXPC: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - UnitTests
        - IntegrationTests
        - RecoveryTests
        - PerformanceTests
        - UITests
